```yaml
name: Generate Blue Purple Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Blue Purple Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: sheikhsiddique722-sketch
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238B5CF6&color_dots=%23E0E7FF,%2393C5FD,%2360A5FA,%233B82F6,%238B5CF6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%238B5CF6&color_dots=%23E0E7FF,%2393C5FD,%2360A5FA,%233B82F6,%238B5CF6

      - name: Publish Contribution Animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
```
